<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dsh — failed to start</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1e1e1e; color: #e0e0e0;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; margin: 0; padding: 24px; box-sizing: border-box;
      }
      .card {
        max-width: 560px; background: #2a2a2a; border-radius: 12px;
        padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      h1 { margin: 0 0 8px; font-size: 22px; color: #ff8a80; }
      p { line-height: 1.6; color: #cfcfcf; }
      code {
        background: #1a1a1a; padding: 2px 6px; border-radius: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #80cbc4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>dsh failed to start</h1>
      <p>
        We found the <code>dsh</code> binary but it did not become ready within
        30 seconds. The most common cause is a missing
        <code>DEEPSEEK_API_KEY</code> in your environment.
      </p>
      <p>
        Run <code>dsh web</code> directly in your terminal to see the actual
        error, then fix it and relaunch dsh-ui.
      </p>
    </div>
  </body>
</html>
